name: OMP RPC compatibility change
description: Report an OMP rpc-ui schema, negotiation, or behavior change.
title: "[paseo-omp rpc] "
body:
  - type: markdown
    attributes:
      value: |
        Use this template only for the OMP `rpc-ui` boundary. Remove credentials, private paths, repository names, prompts, and transcript content from every payload.
  - type: input
    id: omp-version
    attributes:
      label: OMP version and commit
      description: Include the exact `omp --version` output and upstream commit or release URL.
      placeholder: omp/18.1.15; https://github.com/can1357/oh-my-pi/commit/...
    validations:
      required: true
  - type: input
    id: paseo-version
    attributes:
      label: Paseo and plugin versions
      description: Include daemon, app, and paseo-omp versions or commits.
    validations:
      required: true
  - type: dropdown
    id: change-kind
    attributes:
      label: Change kind
      options:
        - New optional method, event, or field
        - New required method, event, or field
        - Removed or renamed method, event, or field
        - Existing field changed type or meaning
        - Negotiation or capability change
        - Unknown compatibility failure
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the exact command, negotiated capabilities, and shortest sequence that exposes the change.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and observed behavior
      description: State the previous contract and the new behavior, including whether the session fails before ready or during a turn.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized schema evidence
      description: Paste the smallest redacted ready, request, response, or event frames needed to show the drift. Do not attach full transcripts.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Intake checks
      options:
        - label: I removed credentials, private paths, repository names, prompts, and transcript content.
          required: true
        - label: I reproduced on the reported OMP build with a clean plugin checkout.
          required: true
        - label: "I recorded whether `typedToolApprovals: 1` was advertised and reciprocally negotiated."
          required: true
