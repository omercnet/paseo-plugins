name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      package-paths: ${{ steps.packages.outputs.paths }}
      paths-released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Check out release configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover package paths
        id: packages
        run: echo "paths=$(jq -c '.packages | keys' release-please-config.json)" >> "$GITHUB_OUTPUT"
      - name: Create or update releases
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-next:
    needs: metadata
    if: ${{ needs.metadata.outputs.package-paths != '' && needs.metadata.outputs.package-paths != '[]' }}
    name: Publish ${{ matrix.directory }} to next
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.metadata.outputs.package-paths) }}
    steps:
      - name: Check out main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install package dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci --include=dev
      - name: Set next version
        working-directory: ${{ matrix.directory }}
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          current="$(node -p "require('./package.json').version")"
          version="${current%%-*}-next.${RUN_NUMBER}.${RUN_ATTEMPT}"
          npm pkg set "version=${version}"
      - name: Preview npm package
        working-directory: ${{ matrix.directory }}
        run: npm pack --dry-run
      - name: Publish next package
        working-directory: ${{ matrix.directory }}
        run: npm publish --access public --provenance --tag next
      - name: Verify next publication
        working-directory: ${{ matrix.directory }}
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          published=""
          tagged=""
          for _ in $(seq 1 180); do
            published="$(npm view "$name@$version" version --json 2>/dev/null | tr -d '"' || true)"
            tagged="$(npm view "$name" dist-tags.next --json 2>/dev/null | tr -d '"' || true)"
            if [[ "$published" == "$version" && "$tagged" == "$version" ]]; then
              break
            fi
            sleep 10
          done
          test "$published" = "$version"
          test "$tagged" = "$version"

  publish-release:
    needs: metadata
    if: ${{ needs.metadata.outputs.paths-released != '' && needs.metadata.outputs.paths-released != '[]' }}
    name: Publish ${{ matrix.directory }} release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.metadata.outputs.paths-released) }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install package dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci --include=dev
      - name: Preview npm package
        working-directory: ${{ matrix.directory }}
        run: npm pack --dry-run
      - name: Publish release package
        working-directory: ${{ matrix.directory }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            channel="${version#*-}"
            npm publish --access public --provenance --tag "${channel%%.*}"
          else
            npm publish --access public --provenance --tag latest
          fi
      - name: Verify release publication
        working-directory: ${{ matrix.directory }}
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if [[ "$version" == *-* ]]; then
            channel="${version#*-}"
            channel="${channel%%.*}"
          else
            channel="latest"
          fi
          published=""
          tagged=""
          for _ in $(seq 1 180); do
            published="$(npm view "$name@$version" version --json 2>/dev/null | tr -d '"' || true)"
            tagged="$(npm view "$name" "dist-tags.${channel}" --json 2>/dev/null | tr -d '"' || true)"
            if [[ "$published" == "$version" && "$tagged" == "$version" ]]; then
              break
            fi
            sleep 10
          done
          test "$published" = "$version"
          test "$tagged" = "$version"
