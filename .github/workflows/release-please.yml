name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create or update releases
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Check out repository
        if: steps.release.outputs['paseo-beads--release_created'] == 'true' || steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        if: steps.release.outputs['paseo-beads--release_created'] == 'true' || steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install paseo-beads dependencies
        if: steps.release.outputs['paseo-beads--release_created'] == 'true'
        working-directory: paseo-beads
        run: bun install --frozen-lockfile
      - name: Verify paseo-beads package
        if: steps.release.outputs['paseo-beads--release_created'] == 'true'
        working-directory: paseo-beads
        run: bun run verify:package
      - name: Build paseo-beads release package
        if: steps.release.outputs['paseo-beads--release_created'] == 'true'
        working-directory: paseo-beads
        run: bun run package:release
      - name: Upload paseo-beads release asset
        if: steps.release.outputs['paseo-beads--release_created'] == 'true'
        working-directory: paseo-beads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs['paseo-beads--tag_name'] }}
        run: gh release upload "$RELEASE_TAG" "dist/$RELEASE_TAG.zip" --clobber
      - name: Install paseo-gas-city dependencies
        if: steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: bun install --frozen-lockfile
      - name: Verify paseo-gas-city package
        if: steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: bun run verify:package
      - name: Build paseo-gas-city release package
        if: steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: bun run package:release
      - name: Upload paseo-gas-city release asset
        if: steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs['paseo-gas-city--tag_name'] }}
        run: gh release upload "$RELEASE_TAG" "dist/$RELEASE_TAG.zip" --clobber
