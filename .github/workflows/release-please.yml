name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create or update releases
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Check out repository
        if: steps.release.outputs['paseo-beads--release_created'] == 'true' || steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        if: steps.release.outputs['paseo-beads--release_created'] == 'true' || steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Install paseo-beads dependencies
        if: steps.release.outputs['paseo-beads--release_created'] == 'true'
        working-directory: paseo-beads
        run: npm ci --include=dev
      - name: Verify paseo-beads package
        if: steps.release.outputs['paseo-beads--release_created'] == 'true'
        working-directory: paseo-beads
        run: npm run verify:package
      - name: Build paseo-beads release package
        if: steps.release.outputs['paseo-beads--release_created'] == 'true'
        working-directory: paseo-beads
        run: npm run package:release
      - name: Upload paseo-beads release asset
        if: steps.release.outputs['paseo-beads--release_created'] == 'true'
        working-directory: paseo-beads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs['paseo-beads--tag_name'] }}
        run: gh release upload "$RELEASE_TAG" "dist/$RELEASE_TAG.zip" --clobber
      - name: Install paseo-gas-city dependencies
        if: steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: npm ci --include=dev
      - name: Check paseo-gas-city
        if: steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: npm run check
      - name: Typecheck paseo-gas-city
        if: steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: npm run typecheck
      - name: Test paseo-gas-city with coverage
        if: steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: npm run test:coverage
      - name: Verify paseo-gas-city package
        if: steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: npm run verify:package
      - name: Build paseo-gas-city release package
        if: steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: npm run package:release
      - name: Checksum paseo-gas-city release package
        if: steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        env:
          RELEASE_TAG: ${{ steps.release.outputs['paseo-gas-city--tag_name'] }}
        run: sha256sum "dist/$RELEASE_TAG.zip" > "dist/$RELEASE_TAG.zip.sha256"
      - name: Upload paseo-gas-city release asset
        if: steps.release.outputs['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs['paseo-gas-city--tag_name'] }}
        run: gh release upload "$RELEASE_TAG" "dist/$RELEASE_TAG.zip" "dist/$RELEASE_TAG.zip.sha256" --clobber
