name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths-released: ${{ steps.release.outputs.paths_released }}
      release-outputs: ${{ toJSON(steps.release.outputs) }}
    steps:
      - name: Create or update releases
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: metadata
    if: ${{ needs.metadata.outputs.paths-released != '' && needs.metadata.outputs.paths-released != '[]' }}
    name: Publish ${{ matrix.directory }} to npm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.metadata.outputs.paths-released) }}
    steps:
      - name: Require successful CI for release commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "No CI push run found for release commit $SHA" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release identity
        working-directory: ${{ matrix.directory }}
        env:
          DIRECTORY: ${{ matrix.directory }}
          RELEASE_OUTPUTS: ${{ needs.metadata.outputs.release-outputs }}
          SHA: ${{ github.sha }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/validate-release-identity.mjs"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify trusted publishing npm
        run: node -e "const v=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim(); const [major,minor,patch]=v.split('.').map(Number); if (!(major>11 || (major===11 && (minor>5 || (minor===5 && patch>=1))))) throw new Error('npm 11.5.1 or newer is required; found '+v)"
      - name: Install package dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci --include=dev
      - name: Preview npm package
        working-directory: ${{ matrix.directory }}
        run: npm pack --dry-run
      - name: Publish npm package
        working-directory: ${{ matrix.directory }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi
      - name: Verify npm publication
        working-directory: ${{ matrix.directory }}
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          published=""
          for _ in $(seq 1 180); do
            published="$(npm view "$name@$version" version --json 2>/dev/null | tr -d '"' || true)"
            if [[ "$published" == "$version" ]]; then
              break
            fi
            sleep 10
          done
          test "$published" = "$version"
  publish-existing-assets:
    needs: metadata
    if: ${{ fromJSON(needs.metadata.outputs.release-outputs)['paseo-beads--release_created'] == 'true' || fromJSON(needs.metadata.outputs.release-outputs)['paseo-gas-city--release_created'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Install paseo-beads dependencies
        if: fromJSON(needs.metadata.outputs.release-outputs)['paseo-beads--release_created'] == 'true'
        working-directory: paseo-beads
        run: npm ci --include=dev
      - name: Verify paseo-beads package
        if: fromJSON(needs.metadata.outputs.release-outputs)['paseo-beads--release_created'] == 'true'
        working-directory: paseo-beads
        run: npm run verify:package
      - name: Build paseo-beads release package
        if: fromJSON(needs.metadata.outputs.release-outputs)['paseo-beads--release_created'] == 'true'
        working-directory: paseo-beads
        run: npm run package:release
      - name: Upload paseo-beads release asset
        if: fromJSON(needs.metadata.outputs.release-outputs)['paseo-beads--release_created'] == 'true'
        working-directory: paseo-beads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ fromJSON(needs.metadata.outputs.release-outputs)['paseo-beads--tag_name'] }}
        run: gh release upload "$RELEASE_TAG" "dist/$RELEASE_TAG.zip" --clobber
      - name: Install paseo-gas-city dependencies
        if: fromJSON(needs.metadata.outputs.release-outputs)['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: npm ci --include=dev
      - name: Check paseo-gas-city
        if: fromJSON(needs.metadata.outputs.release-outputs)['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: npm run check
      - name: Typecheck paseo-gas-city
        if: fromJSON(needs.metadata.outputs.release-outputs)['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: npm run typecheck
      - name: Test paseo-gas-city with coverage
        if: fromJSON(needs.metadata.outputs.release-outputs)['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: npm run test:coverage
      - name: Verify paseo-gas-city package
        if: fromJSON(needs.metadata.outputs.release-outputs)['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: npm run verify:package
      - name: Build paseo-gas-city release package
        if: fromJSON(needs.metadata.outputs.release-outputs)['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        run: npm run package:release
      - name: Checksum paseo-gas-city release package
        if: fromJSON(needs.metadata.outputs.release-outputs)['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        env:
          RELEASE_TAG: ${{ fromJSON(needs.metadata.outputs.release-outputs)['paseo-gas-city--tag_name'] }}
        run: sha256sum "dist/$RELEASE_TAG.zip" > "dist/$RELEASE_TAG.zip.sha256"
      - name: Upload paseo-gas-city release asset
        if: fromJSON(needs.metadata.outputs.release-outputs)['paseo-gas-city--release_created'] == 'true'
        working-directory: paseo-gas-city
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ fromJSON(needs.metadata.outputs.release-outputs)['paseo-gas-city--tag_name'] }}
        run: gh release upload "$RELEASE_TAG" "dist/$RELEASE_TAG.zip" "dist/$RELEASE_TAG.zip.sha256" --clobber


  publish-paseo-omp:
    needs: metadata
    if: ${{ fromJSON(needs.metadata.outputs.release-outputs)['paseo-omp--release_created'] == 'true' }}
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: $/.github/workflows/publish-paseo-omp.yml
    with:
      tag: ${{ fromJSON(needs.metadata.outputs.release-outputs)['paseo-omp--tag_name'] }}
      sha: ${{ fromJSON(needs.metadata.outputs.release-outputs)['paseo-omp--sha'] }}
