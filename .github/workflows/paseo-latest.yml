name: Paseo SDK compatibility

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: paseo-sdk-compatibility
  cancel-in-progress: false

jobs:
  paseo-sdk:
    name: paseo-omp Paseo SDK (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, beta]
    defaults:
      run:
        working-directory: paseo-omp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Install selected Paseo SDK packages without saving
        id: sdk-install
        continue-on-error: true
        run: bun add --no-save --dev @getpaseo/cli@${{ matrix.channel }} @getpaseo/client@${{ matrix.channel }} @getpaseo/plugin@${{ matrix.channel }} @getpaseo/protocol@${{ matrix.channel }} @getpaseo/server@${{ matrix.channel }}
      - name: Read installed Paseo SDK version
        id: paseo
        if: ${{ steps.sdk-install.outcome == 'success' }}
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("node_modules/@getpaseo/plugin/package.json", "utf8")).version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check selected Paseo SDK contract
        id: typecheck
        if: ${{ steps.sdk-install.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"
      - name: Test selected Paseo SDK compatibility
        id: test
        if: ${{ steps.sdk-install.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Record Paseo SDK compatibility result
        if: ${{ always() }}
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPAT_LABEL: compat-paseo-${{ matrix.channel }}
          PASEO_CHANNEL: ${{ matrix.channel }}
          PASEO_VERSION: ${{ steps.paseo.outputs.version || 'unresolved' }}
          INSTALL_OUTCOME: ${{ steps.sdk-install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          first_error() {
            [ -f "$1" ] || { printf '(no log captured)'; return 0; }
            line="$(sed 's/\x1b\[[0-9;]*m//g' "$1" | grep -E 'error TS[0-9]+|^[[:space:]]*(Error:|FAIL )' | grep -v 'Command failed' | head -1 | tr -d '\r`' | cut -c1-300 || true)"
            printf '%s' "${line:-(no error line captured; see the run log)}"
          }
          if [ "$INSTALL_OUTCOME" = success ] && [ "$TYPECHECK_OUTCOME" = success ] && [ "$TEST_OUTCOME" = success ]; then
            COMPAT_STATE=passing
            COMPAT_TITLE="Paseo ${PASEO_CHANNEL} compatibility"
            printf '%s\n' "Paseo SDK \`${PASEO_VERSION}\` (${PASEO_CHANNEL}) passes typecheck and the unit suite. Run: ${RUN_URL}" > "$RUNNER_TEMP/compat-body.md"
          else
            COMPAT_STATE=failing
            COMPAT_TITLE="Paseo ${PASEO_CHANNEL} compatibility: failing on ${PASEO_VERSION}"
            {
              echo "## Paseo SDK compatibility drift (${PASEO_CHANNEL})"
              echo
              echo "SDK \`${PASEO_VERSION}\`. Install: \`${INSTALL_OUTCOME}\`. Typecheck: \`${TYPECHECK_OUTCOME}\`. Unit suite: \`${TEST_OUTCOME}\`. Run: ${RUN_URL}"
              echo
              echo "First typecheck error: \`$(first_error "$RUNNER_TEMP/typecheck.log")\`"
              echo
              echo "First test failure: \`$(first_error "$RUNNER_TEMP/test.log")\`"
              echo
              echo "This single issue tracks the ${PASEO_CHANNEL} channel. It is updated nightly while failing and closed automatically when the channel passes."
            } > "$RUNNER_TEMP/compat-body.md"
          fi
          export COMPAT_STATE COMPAT_TITLE COMPAT_BODY_FILE="$RUNNER_TEMP/compat-body.md"
          node .github/scripts/report-compat.mjs
      - name: Fail on Paseo SDK compatibility drift
        if: ${{ steps.sdk-install.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.test.outcome == 'failure' }}
        run: exit 1
