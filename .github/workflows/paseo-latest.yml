name: Paseo latest compatibility

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: paseo-latest-compatibility
  cancel-in-progress: false

jobs:
  paseo-latest:
    name: paseo-omp latest Paseo SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: paseo-omp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Install latest Paseo SDK packages without saving
        id: sdk-install
        continue-on-error: true
        run: bun add --no-save --dev @getpaseo/cli@latest @getpaseo/client@latest @getpaseo/plugin@latest @getpaseo/protocol@latest @getpaseo/server@latest
      - name: Read installed Paseo SDK version
        id: paseo
        if: ${{ steps.sdk-install.outcome == 'success' }}
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("node_modules/@getpaseo/plugin/package.json", "utf8")).version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check latest Paseo SDK contract
        id: typecheck
        if: ${{ steps.sdk-install.outcome == 'success' }}
        continue-on-error: true
        run: npm run typecheck
      - name: Test latest Paseo SDK compatibility
        id: test
        if: ${{ steps.sdk-install.outcome == 'success' }}
        continue-on-error: true
        run: npm test
      - name: Record latest Paseo compatibility result
        if: ${{ always() }}
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PASEO_VERSION: ${{ steps.paseo.outputs.version || 'unresolved' }}
          INSTALL_OUTCOME: ${{ steps.sdk-install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Paseo latest compatibility ${PASEO_VERSION}: install=${INSTALL_OUTCOME}, typecheck=${TYPECHECK_OUTCOME}, test=${TEST_OUTCOME}"
          existing="$(gh api -X GET search/issues -f "q=repo:${GITHUB_REPOSITORY} is:issue in:title \"${title}\"" --jq '.items[] | .title + "\t" + (.number | tostring)' | node -e 'const title = process.argv[1]; const rows = require("node:fs").readFileSync(0, "utf8").trim().split("\n").filter(Boolean); for (const row of rows) { const [candidate, number] = row.split("\t"); if (candidate === title) { process.stdout.write(number); break; } }' "$title")"
          if [ -n "$existing" ]; then
            echo "Compatibility result already recorded in #$existing"
            exit 0
          fi
          body="$(printf '%s\n' "## Paseo latest compatibility result" "" "- Paseo SDK version: \`${PASEO_VERSION}\`" "- SDK installation: \`${INSTALL_OUTCOME}\`" "- Typecheck: \`${TYPECHECK_OUTCOME}\`" "- Full unit suite: \`${TEST_OUTCOME}\`" "- Workflow run: ${RUN_URL}" "" "Automated nightly result. The issue title is an idempotency key for this exact version and outcome tuple.")"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
      - name: Fail on latest Paseo compatibility drift
        if: ${{ steps.sdk-install.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.test.outcome == 'failure' }}
        run: exit 1
