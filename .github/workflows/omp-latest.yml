name: OMP latest compatibility

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: omp-latest-compatibility
  cancel-in-progress: false
jobs:
  omp-latest-canary:
    name: paseo-omp latest OMP canary
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: paseo-omp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Install latest OMP typing packages without saving
        run: bun add --no-save --dev @oh-my-pi/pi-agent-core@latest @oh-my-pi/pi-coding-agent@latest
      - name: Check latest OMP SDK contract
        id: sdk-contract
        continue-on-error: true
        run: |
          set -o pipefail
          bunx --no-install tsc --noEmit -p tsconfig.tests.json 2>&1 | tee "$RUNNER_TEMP/sdk.log"
      - name: Resolve latest OMP release
        id: omp
        run: |
          release="$RUNNER_TEMP/omp-release.json"
          curl --fail --location --retry 3 --max-time 300 \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/can1357/oh-my-pi/releases/latest \
            --output "$release"
          tag="$(node -e 'const release = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (typeof release.tag_name !== "string" || !/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(release.tag_name)) process.exit(1); process.stdout.write(release.tag_name);' "$release")"
          version="${tag#v}"
          install -d "$RUNNER_TEMP/omp-assets"
          for arch in amd64 arm64; do
            asset="omp-linux-$([ "$arch" = amd64 ] && printf x64 || printf arm64)"
            curl --fail --location --retry 3 --max-time 300 \
              "https://github.com/can1357/oh-my-pi/releases/download/${tag}/${asset}" \
              --output "$RUNNER_TEMP/omp-assets/$asset"
            sha256sum "$RUNNER_TEMP/omp-assets/$asset" >> "$RUNNER_TEMP/omp-assets/SHA256SUMS"
          done
          amd64="$(awk '/omp-linux-x64$/ { print $1 }' "$RUNNER_TEMP/omp-assets/SHA256SUMS")"
          arm64="$(awk '/omp-linux-arm64$/ { print $1 }' "$RUNNER_TEMP/omp-assets/SHA256SUMS")"
          test -n "$amd64" && test -n "$arm64"
          {
            echo "version=$version"
            echo "amd64=$amd64"
            echo "arm64=$arm64"
          } >> "$GITHUB_OUTPUT"
      - name: Run latest OMP provider canary
        id: canary
        continue-on-error: true
        env:
          PASEO_CANARY_OMP_VERSION: ${{ steps.omp.outputs.version }}
          PASEO_CANARY_OMP_SHA256_AMD64: ${{ steps.omp.outputs.amd64 }}
          PASEO_CANARY_OMP_SHA256_ARM64: ${{ steps.omp.outputs.arm64 }}
        run: |
          set -o pipefail
          npm run test:integration:canary 2>&1 | tee "$RUNNER_TEMP/canary.log"
      - name: Record latest OMP compatibility result
        if: ${{ always() }}
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPAT_LABEL: compat-omp-latest
          OMP_VERSION: ${{ steps.omp.outputs.version || 'unresolved' }}
          SDK_OUTCOME: ${{ steps.sdk-contract.outcome }}
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          first_error() {
            [ -f "$1" ] || { printf '(no log captured)'; return 0; }
            line="$(sed 's/\x1b\[[0-9;]*m//g' "$1" | grep -E 'error TS[0-9]+|^[[:space:]]*(Error:|FAIL )' | grep -v 'Command failed' | head -1 | tr -d '\r`' | cut -c1-300 || true)"
            printf '%s' "${line:-(no error line captured; see the run log)}"
          }
          if [ "$SDK_OUTCOME" = success ] && [ "$CANARY_OUTCOME" = success ]; then
            COMPAT_STATE=passing
            COMPAT_TITLE="OMP latest compatibility"
            printf '%s\n' "Latest OMP \`${OMP_VERSION}\` passes the SDK contract and the Docker canary. Run: ${RUN_URL}" > "$RUNNER_TEMP/compat-body.md"
          else
            COMPAT_STATE=failing
            COMPAT_TITLE="OMP latest compatibility: failing on ${OMP_VERSION}"
            {
              echo "## OMP latest compatibility drift"
              echo
              echo "Latest OMP: \`${OMP_VERSION}\`. SDK contract: \`${SDK_OUTCOME}\`. Docker canary: \`${CANARY_OUTCOME}\`. Run: ${RUN_URL}"
              echo
              echo "First SDK error: \`$(first_error "$RUNNER_TEMP/sdk.log")\`"
              echo
              echo "First canary error: \`$(first_error "$RUNNER_TEMP/canary.log")\`"
              echo
              echo "This single issue tracks the lane. It is updated nightly while failing and closed automatically when the lane passes. Pinned-matrix CI is unaffected."
            } > "$RUNNER_TEMP/compat-body.md"
          fi
          export COMPAT_STATE COMPAT_TITLE COMPAT_BODY_FILE="$RUNNER_TEMP/compat-body.md"
          node .github/scripts/report-compat.mjs
      - name: Fail on latest OMP compatibility drift
        if: ${{ steps.sdk-contract.outcome == 'failure' || steps.canary.outcome == 'failure' }}
        run: exit 1
