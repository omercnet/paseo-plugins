name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bun-plugins:
    name: ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: agent-crew
            check: true
          - plugin: agent-monitor
            check: true
          - plugin: fresh-worktrees
            check: false
          - plugin: paseo-omp
            check: true
          - plugin: paseo-dracula
            check: true
          - plugin: pr-radar
            check: true
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting and lint
        if: ${{ matrix.check }}
        run: bun run check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Docker host-tool ownership integration
        if: ${{ matrix.plugin == 'paseo-omp' }}
        run: bun run test:integration:docker

  shared-browser:
    name: paseo-shared-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: paseo-shared-browser
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paseo-shared-browser/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests
        run: npm run test:unit

  wsl-host-tools:
    name: paseo-omp WSL host ownership
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: paseo-omp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Windows Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install Windows dependencies
        run: bun install --frozen-lockfile
      - name: Require an available WSL distribution
        shell: pwsh
        working-directory: .
        run: |
          $distros = @(wsl.exe --list --quiet | ForEach-Object { $_ -replace "`0", "" } | Where-Object { $_.Trim() })
          if ($LASTEXITCODE -ne 0 -or $distros.Count -eq 0) {
            throw "The Windows runner does not provide an executable WSL distribution"
          }
          wsl.exe --exec sh -lc "uname -a"
      - name: Install Bun in WSL
        shell: pwsh
        working-directory: .
        run: wsl.exe --exec sh -lc 'curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.0"'
      - name: Install WSL dependencies
        shell: pwsh
        working-directory: .
        run: |
          $wslRoot = (wsl.exe --exec wslpath -a "$env:GITHUB_WORKSPACE").Trim()
          if (-not $wslRoot) { throw "Could not map the checkout into WSL" }
          $command = "cd '$wslRoot/paseo-omp' && `$HOME/.bun/bin/bun install --frozen-lockfile"
          wsl.exe --exec sh -lc $command
      - name: WSL host-tool ownership integration
        env:
          PASEO_OMP_REQUIRE_WSL: "1"
        run: bun run test:integration:wsl
