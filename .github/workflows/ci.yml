name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bun-plugins:
    name: ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: agent-crew
            check: true
          - plugin: agent-monitor
            check: true
          - plugin: fresh-worktrees
            check: false
          - plugin: paseo-omp
            check: true
          - plugin: paseo-dracula
            check: true
          - plugin: pr-radar
            check: true
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting and lint
        if: ${{ matrix.check }}
        run: bun run check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        if: ${{ matrix.plugin != 'paseo-omp' }}
        run: bun test
      - name: Test with coverage
        if: ${{ matrix.plugin == 'paseo-omp' }}
        run: bun run test:coverage
      - name: Archive and Git package installation smoke
        if: ${{ matrix.plugin == 'paseo-omp' }}
        run: bun run test:integration:install
      - name: Docker host-tool ownership integration
        if: ${{ matrix.plugin == 'paseo-omp' }}
        run: bun run test:integration:docker

  omp-core-cutover:
    name: paseo-omp pinned core cutover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - name: Check out plugin repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out legacy Paseo core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: getpaseo/paseo
          ref: f4b209be4d81d25a6143d12d374d797d485e8faa
          path: .ci/paseo-legacy
          persist-credentials: false
      - name: Check out cutover Paseo core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omercnet/paseo
          ref: 761b0b4729bc748a122f784602c15bd81293100b
          path: .ci/paseo-cutover
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            .ci/paseo-legacy/package-lock.json
            .ci/paseo-cutover/package-lock.json
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install plugin dependencies
        working-directory: paseo-omp
        run: bun install --frozen-lockfile
      - name: Install legacy core dependencies
        working-directory: .ci/paseo-legacy
        run: npm ci
      - name: Install cutover core dependencies
        working-directory: .ci/paseo-cutover
        run: npm ci
      - name: Run package and core cutover integration
        working-directory: paseo-omp
        env:
          PASEO_LEGACY_CORE_ROOT: ${{ github.workspace }}/.ci/paseo-legacy
          PASEO_CUTOVER_CORE_ROOT: ${{ github.workspace }}/.ci/paseo-cutover
        run: bun run test:integration:core

  omp-real-e2e:
    name: paseo-omp real OMP 18.1.15
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: paseo-omp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned OMP
        env:
          OMP_SHA256: 747518a41fbb32ac47491b4677a7a921d0d9e5977ae006c358d6836813149adc
          OMP_URL: https://github.com/can1357/oh-my-pi/releases/download/v18.1.15/omp-linux-x64
        run: |
          install -d "$RUNNER_TEMP/omp-bin"
          curl --fail --location --retry 3 --max-time 300 "$OMP_URL" --output "$RUNNER_TEMP/omp-bin/omp"
          echo "$OMP_SHA256  $RUNNER_TEMP/omp-bin/omp" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/omp-bin/omp"
          echo "$RUNNER_TEMP/omp-bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/omp-bin/omp" --version)" = "omp/18.1.15"
      - name: Run real OMP provider scenarios
        env:
          PASEO_OMP_REAL_E2E: "1"
        run: bun test tests/provider.real.e2e.test.ts


  shared-browser:
    name: paseo-shared-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: paseo-shared-browser
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paseo-shared-browser/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests
        run: npm run test:unit

  wsl-host-tools:
    name: paseo-omp WSL host ownership
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: paseo-omp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Windows Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install Windows dependencies
        run: bun install --frozen-lockfile
      - name: Provision WSL distribution
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          set-as-default: "true"
      - name: Require an available WSL distribution
        shell: pwsh
        working-directory: .
        run: |
          $distros = @(wsl.exe --list --quiet | ForEach-Object { $_ -replace "`0", "" } | Where-Object { $_.Trim() })
          if ($LASTEXITCODE -ne 0 -or $distros.Count -eq 0) {
            throw "The Windows runner does not provide an executable WSL distribution"
          }
          wsl.exe --exec sh -lc "uname -a"
      - name: Install Bun in WSL
        shell: pwsh
        working-directory: .
        run: wsl.exe --exec sh -lc 'curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.0"'
      - name: Install WSL dependencies
        shell: pwsh
        working-directory: .
        run: |
          $wslRoot = (wsl.exe --exec wslpath -a "$env:GITHUB_WORKSPACE").Trim()
          if (-not $wslRoot) { throw "Could not map the checkout into WSL" }
          $command = "cd '$wslRoot/paseo-omp' && `$HOME/.bun/bin/bun install --frozen-lockfile"
          wsl.exe --exec sh -lc $command
      - name: WSL host-tool ownership integration
        env:
          PASEO_OMP_REQUIRE_WSL: "1"
        run: bun run test:integration:wsl
