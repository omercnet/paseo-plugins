name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bun-plugins:
    name: ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: agent-crew
            check: true
          - plugin: tell-agent
            check: true
          - plugin: agent-monitor
            check: true
          - plugin: fresh-worktrees
            check: false
          - plugin: paseo-dracula
            check: true
          - plugin: paseo-beads
            check: true
            coverage: true
            verify-package: true
          - plugin: paseo-gas-city
            check: true
            coverage: true
            verify-package: true
          - plugin: pr-radar
            check: true
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting and lint
        if: ${{ matrix.check }}
        run: bun run check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Test coverage
        if: ${{ matrix.coverage }}
        run: bun run test:coverage
      - name: Verify package publication contents
        if: ${{ matrix.verify-package }}
        run: bun run verify:package

  shared-browser:
    name: paseo-shared-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: paseo-shared-browser
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: paseo-shared-browser/package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests
        run: npm run test:unit
