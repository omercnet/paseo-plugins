name: Publish Paseo OMP

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing paseo-omp release tag to rebuild and upload idempotently
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-paseo-omp-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Resolve and validate release tag
        id: release
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${TAG}" =~ ^paseo-omp-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid paseo-omp release tag: ${TAG}" >&2
            exit 1
          fi
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          if [[ -n "${EXPECTED_SHA}" && "${sha}" != "${EXPECTED_SHA}" ]]; then
            echo "Release tag ${TAG} resolves to ${sha}, expected ${EXPECTED_SHA}" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#paseo-omp-v}" >> "${GITHUB_OUTPUT}"
      - name: Require successful CI for release commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${SHA}" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "${run_id}" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "${run_id}" ]]; then
            echo "No CI push run found for release commit ${SHA}" >&2
            exit 1
          fi
          gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - name: Verify checked-out release identity
        env:
          SHA: ${{ steps.release.outputs.sha }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "${SHA}"
          test "$(node -p "require('./paseo-omp/package.json').version")" = "${VERSION}"
          test "${TAG}" = "paseo-omp-v${VERSION}"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paseo-omp/package-lock.json
      - name: Install package tooling
        working-directory: paseo-omp
        run: npm ci
      - name: Verify archive and Git installation
        working-directory: paseo-omp
        run: npm run test:integration:install
      - name: Build release archive and checksum
        working-directory: paseo-omp
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          archive="paseo-omp-v${VERSION}.zip"
          npm run package:release -- "dist/${archive}"
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")
      - name: Reverify immutable release target
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.release.outputs.sha }}
          TAG: ${{ inputs.tag }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)" = "${SHA}"
      - name: Sign build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            paseo-omp/dist/paseo-omp-v${{ steps.release.outputs.version }}.zip
            paseo-omp/dist/paseo-omp-v${{ steps.release.outputs.version }}.zip.sha256
      - name: Upload release assets idempotently
        working-directory: paseo-omp
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          archive="dist/paseo-omp-v${VERSION}.zip"
          gh release upload "${TAG}" "${archive}" "${archive}.sha256" --clobber
