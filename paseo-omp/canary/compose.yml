name: paseo-omp-canary

services:
  mock-llm:
    image: node:22.22.1-bookworm-slim@sha256:4f77a690f2f8946ab16fe1e791a3ac0667ae1c3575c3e4d0d4589e9ed5bfaf3d
    command: ["node", "/app/mock-llm.ts"]
    volumes:
      - ./mock-llm.ts:/app/mock-llm.ts:ro
    ports:
      - "127.0.0.1:${PASEO_CANARY_MOCK_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const response = await fetch('http://127.0.0.1:8080/health'); process.exit(response.ok ? 0 : 1)",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

  paseo:
    build:
      context: ../..
      dockerfile: paseo-omp/canary/Dockerfile
    image: paseo-omp-canary:local
    depends_on:
      mock-llm:
        condition: service_healthy
    environment:
      PASEO_PASSWORD: ${PASEO_CANARY_PASSWORD:?Set PASEO_CANARY_PASSWORD}
      PASEO_DICTATION_ENABLED: "false"
      PASEO_VOICE_MODE_ENABLED: "false"
    ports:
      - "${PASEO_CANARY_BIND:-127.0.0.1}:${PASEO_CANARY_PORT:-6768}:6767"
    volumes:
      - ${PASEO_CANARY_WORKSPACE:-../..}:/workspace/paseo-plugins
    stop_grace_period: 15s

  ollama:
    profiles: ["local-model"]
    image: ollama/ollama:0.32.15@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 3s
      retries: 30

  ollama-pull:
    profiles: ["local-model"]
    image: ollama/ollama:0.32.15@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "qwen2.5:0.5b"]

volumes:
  ollama-data:
