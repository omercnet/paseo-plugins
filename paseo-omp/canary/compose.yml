name: paseo-omp-canary

services:
  mock-llm:
    image: oven/bun:1.4.0@sha256:5ff609364c049b54eb0ff560ec96319729a972078ef2c755d758f0c6ef89c2d6
    command: ["bun", "/app/mock-llm.ts"]
    volumes:
      - ./mock-llm.ts:/app/mock-llm.ts:ro
    ports:
      - "127.0.0.1:${PASEO_CANARY_MOCK_PORT:-18080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:8080/health'); process.exit(response.ok ? 0 : 1)",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

  paseo:
    build:
      context: ../..
      dockerfile: paseo-omp/canary/Dockerfile
    image: paseo-omp-canary:local
    depends_on:
      mock-llm:
        condition: service_healthy
    environment:
      PASEO_PASSWORD: ${PASEO_CANARY_PASSWORD:?Set PASEO_CANARY_PASSWORD}
      PASEO_DICTATION_ENABLED: "false"
      PASEO_VOICE_MODE_ENABLED: "false"
    ports:
      - "${PASEO_CANARY_BIND:-127.0.0.1}:${PASEO_CANARY_PORT:-6768}:6767"
    volumes:
      - ${PASEO_CANARY_WORKSPACE:-../..}:/workspace/paseo-plugins
    stop_grace_period: 15s

  ollama:
    profiles: ["local-model"]
    image: ollama/ollama:0.11.10@sha256:a5409cb903d30f9cd67e9f430dd336ddc9274e16fd78f75b675c42065991b4fd
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 3s
      retries: 30

  ollama-pull:
    profiles: ["local-model"]
    image: ollama/ollama:0.11.10@sha256:a5409cb903d30f9cd67e9f430dd336ddc9274e16fd78f75b675c42065991b4fd
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "qwen2.5:0.5b"]

volumes:
  ollama-data:
